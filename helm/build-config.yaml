apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pipelines-azure-devops-openshift
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: pipelines-azure-devops-openshift
spec:
  source:
    type: Git
    git:
      uri: https://github.com/Sergio-Villalba-Diaz/pipelines-azure-devops-openshift.git
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: pipelines-azure-devops-openshift:latest
