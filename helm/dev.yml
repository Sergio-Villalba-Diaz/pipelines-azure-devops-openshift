apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipelines-azure-devops-openshift
  labels:
    app: pipelines-azure-devops-openshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipelines-azure-devops-openshift
  template:
    metadata:
      labels:
        app: pipelines-azure-devops-openshift
    spec:
      containers:
        - name: java-app
          image: image-registry.openshift-image-registry.svc:5000/sergioasecas11-dev/pipelines-azure-devops-openshift:latest
          ports:
            - containerPort: 8080
